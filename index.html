<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at 50% 120%, #10233f 0%, #0a1526 45%, #05080f 100%);
    color: #e8f1f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* --- Sterne --- */
  .stars, .stars::before, .stars::after {
    position: absolute;
    inset: 0;
    content: "";
    background-repeat: repeat;
    pointer-events: none;
  }
  .stars {
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, #ffffffcc 50%, transparent 51%),
      radial-gradient(1px 1px at 38% 8%,  #ffffff99 50%, transparent 51%),
      radial-gradient(2px 2px at 67% 22%, #ffffffbb 50%, transparent 51%),
      radial-gradient(1px 1px at 82% 12%, #ffffff88 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 25% 35%, #ffffff77 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 40%, #ffffff99 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 6%,  #ffffffaa 50%, transparent 51%);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  .stars::before {
    background-image:
      radial-gradient(1px 1px at 20% 55%, #ffffff66 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 48% 48%, #ffffff88 50%, transparent 51%),
      radial-gradient(1px 1px at 74% 60%, #ffffff66 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 70%,  #ffffff77 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 92% 75%, #ffffff88 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 80%, #ffffff55 50%, transparent 51%);
    animation: twinkle 5.5s ease-in-out infinite alternate-reverse;
  }
  @keyframes twinkle {
    from { opacity: 0.55; }
    to   { opacity: 1; }
  }

  /* --- Mond --- */
  .moon {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fdf6d8, #e8d98f 60%, #c9b45f);
    box-shadow: 0 0 60px 20px rgba(230, 220, 160, 0.18),
                0 0 140px 60px rgba(230, 220, 160, 0.07);
    opacity: 0.85;
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 720px;
  }

  /* --- Schlafender Geist --- */
  .ghost-wrap {
    position: relative;
    width: min(300px, 55vw);
    margin: 0 auto 1.5rem;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50%      { transform: translateY(-14px) rotate(1.5deg); }
  }
  .ghost-wrap svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 8px 30px rgba(88, 227, 228, 0.15)); }

  /* --- Zzz --- */
  .zzz {
    position: absolute;
    top: -6%;
    right: 2%;
    font-weight: 700;
    color: #8fd8ea;
    pointer-events: none;
  }
  .zzz span {
    position: absolute;
    opacity: 0;
    animation: rise 3.6s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(88, 227, 228, 0.5);
  }
  .zzz span:nth-child(1) { font-size: 1.1rem; animation-delay: 0s;    right: 0; }
  .zzz span:nth-child(2) { font-size: 1.5rem; animation-delay: 1.2s;  right: -14px; }
  .zzz span:nth-child(3) { font-size: 2rem;   animation-delay: 2.4s;  right: -30px; }
  @keyframes rise {
    0%   { opacity: 0; transform: translate(0, 10px) rotate(-6deg) scale(0.7); }
    25%  { opacity: 1; }
    75%  { opacity: 0.9; }
    100% { opacity: 0; transform: translate(18px, -46px) rotate(8deg) scale(1.15); }
  }

  h1 {
    font-size: clamp(2.6rem, 8vw, 4.5rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    background: linear-gradient(90deg, #58e3e4, #3b88c5 60%, #8fd8ea);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: #a8c2d8;
    font-weight: 300;
    line-height: 1.7;
    margin-bottom: 2rem;
  }
  .sub strong { color: #e8f1f8; font-weight: 500; }

  .contact {
    display: inline-block;
    font-size: 0.95rem;
    color: #8fd8ea;
    text-decoration: none;
    border: 1px solid rgba(88, 227, 228, 0.35);
    border-radius: 999px;
    padding: 0.6rem 1.6rem;
    transition: background 0.25s, box-shadow 0.25s;
  }
  .contact:hover {
    background: rgba(88, 227, 228, 0.1);
    box-shadow: 0 0 24px rgba(88, 227, 228, 0.15);
  }

  footer {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 1.2rem 1.5rem;
    font-size: 0.72rem;
    color: #4d6379;
    text-align: center;
    line-height: 1.6;
    z-index: 1;
  }
  footer a { color: #5d7a94; text-decoration: none; }
  footer a:hover { color: #8fd8ea; }

  @media (prefers-reduced-motion: reduce) {
    .ghost-wrap, .stars, .stars::before, .zzz span { animation: none; }
    .zzz span { opacity: 0.9; position: static; margin-left: 0.4rem; }
  }
</style>
